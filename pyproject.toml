[project]
name = "langgraph-school-demo"
version = "0.1.0"
description = "Read-only LangGraph student grades assistant"
requires-python = ">=3.12,<3.13"
dependencies = ["langgraph>=1,<2", "langchain>=1,<2", "langchain-openai>=1,<2", "sqlalchemy>=2,<3", "pymysql>=1,<2", "pydantic>=2,<3", "python-dotenv>=1,<2", "sqlglot>=28", "streamlit>=1.40,<2", "plotly>=6,<7"]
[dependency-groups]
dev = ["pytest>=8,<10"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/school_agent"]
[tool.pytest.ini_options]
testpaths = ["tests"]
